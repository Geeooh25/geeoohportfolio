[build]
  publish = "client"
  
[[redirects]]
  from = "/api/*"
  to = "https://geeoohportfolio-j34k.onrender.com/api/:splat"
  status = 200
  force = true

# This tells Netlify to serve the HTML file if the extension is missing
[[redirects]]
  from = "/pages/admin/login"
  to = "/pages/admin/login.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200